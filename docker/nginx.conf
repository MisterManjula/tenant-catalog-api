# Pure API: every request goes to the front controller, no static files are served,
# so nginx does not need a volume shared with the app container.
server {
    listen 80;
    location / {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }
}
